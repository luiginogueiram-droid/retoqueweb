<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Retoque IA</title>
<style>
  :root { --bg:#0e0e10; --card:#18181c; --line:#2a2a30; --text:#ececee; --muted:#9a9aa3; --gold:#c9a227; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         padding: max(12px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom)); max-width: 560px; margin-inline:auto; }
  h1 { font-size: 20px; margin: 4px 0 2px; } h1 span { color: var(--gold); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .stage { background: var(--card); border:1px solid var(--line); border-radius: 14px; overflow:hidden; min-height: 180px; display:grid; place-items:center;
           background-image: linear-gradient(45deg,#222 25%,transparent 25%),linear-gradient(-45deg,#222 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222 75%),linear-gradient(-45deg,transparent 75%,#222 75%);
           background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
  canvas { max-width:100%; max-height: 62vh; display:block; touch-action: none; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin: 12px 0; }
  button, .btn { appearance:none; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:12px; padding:12px 14px; font:inherit; font-weight:600; flex:1 1 auto; text-align:center; cursor:pointer; user-select:none; -webkit-user-select:none; }
  .primary { background: var(--gold); color:#16130a; border-color: var(--gold); }
  button:disabled { opacity:.5; }
  input[type=file] { display:none; }
  #status { color: var(--muted); font-size: 14px; min-height: 20px; margin: 6px 2px 10px; }
  details { background: var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; padding: 0 12px; }
  summary { padding: 13px 0; font-weight:600; cursor:pointer; }
  .row { display:block; padding: 8px 0 12px; font-size:14px; }
  .row span b { float:right; color: var(--gold); font-weight:600; }
  .row input[type=range] { width:100%; accent-color: var(--gold); margin-top:6px; }
  .row select, .row input[type=color] { width:100%; margin-top:6px; padding:10px; background:#101013; color:var(--text); border:1px solid var(--line); border-radius:10px; font:inherit; height:44px; }
  .row.check { display:flex; gap:10px; align-items:center; } .row.check input { width:22px; height:22px; accent-color: var(--gold); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; line-height: 1.35; color: var(--muted); max-height: 280px; overflow:auto; margin: 0 0 12px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
<h1>Retoque <span>IA</span></h1>
<div class="sub">Roda no seu celular. As fotos não saem do aparelho.</div>

<div class="stage"><canvas id="view" width="1" height="1"></canvas></div>
<div id="status">Escolha uma foto para começar.</div>

<div class="bar">
  <label class="btn" for="pick">Escolher foto(s)</label>
  <input id="pick" type="file" accept="image/*" multiple>
  <button id="final" class="primary" hidden>Gerar versão final</button>
</div>
<div class="bar">
  <button id="peek" hidden>Segure para ver o original</button>
</div>
<div class="bar">
  <button id="batch" hidden>Processar todas</button>
  <button id="batchSave" hidden class="primary">Salvar todas</button>
</div>

<div id="controls"></div>
<details id="diag">
  <summary>Diagnóstico</summary>
  <div class="bar">
    <button id="selfTest">Testar sistema</button>
    <button id="copyLog">Copiar relatório</button>
  </div>
  <pre id="log">Nada registrado ainda.</pre>
</details>
<footer>Dica: no menu do navegador, escolha “Adicionar à tela inicial” para usar como app e funcionar sem internet.</footer>

<script src="lib/face_mesh/face_mesh.js" defer></script>
<script src="lib/selfie_segmentation/selfie_segmentation.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
